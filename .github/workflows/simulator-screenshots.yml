name: Capture Magpie Simulator Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Boot standard iPhone Simulator
        run: |
          SIM_UDID=$(python3 -c '
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devs in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  name = d.get("name", "")
                  if d.get("isAvailable") and "iPhone" in name and "Duo" not in name:
                      candidates.append((runtime, "iPhone 18 Pro" == name, "Pro" in name, name, d["udid"]))
          if not candidates:
              sys.exit("No available standard iPhone simulator found")
          candidates.sort(key=lambda x: (x[0], x[1], x[2], x[3]), reverse=True)
          print(f"Selected: {candidates[0]}", file=sys.stderr)
          print(candidates[0][4])
          ')
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Generate temporary UITest target and XcodeGen project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi
          mkdir -p MagpieUITests
          cat << 'EOF' > MagpieUITests/MagpieScreenshotTests.swift
          import XCTest

          final class MagpieScreenshotTests: XCTestCase {
              private func saveShot(_ name: String) {
                  let shot = XCUIScreen.main.screenshot()
                  let att = XCTAttachment(screenshot: shot)
                  att.name = name
                  att.lifetime = .keepAlways
                  add(att)
              }

              private func tapButton(matching suffix: String, in app: XCUIApplication, timeout: TimeInterval = 6) {
                  let pred = NSPredicate(format: "label ENDSWITH %@", suffix)
                  let btn = app.buttons.matching(pred).firstMatch
                  if btn.waitForExistence(timeout: timeout) {
                      btn.tap()
                  } else {
                      let containsPred = NSPredicate(format: "label CONTAINS %@", suffix)
                      let fallback = app.buttons.matching(containsPred).firstMatch
                      XCTAssertTrue(fallback.waitForExistence(timeout: timeout), "Button '\(suffix)' not found")
                      fallback.tap()
                  }
              }

              func testCaptureAllTabs() {
                  let app = XCUIApplication()
                  app.launch()
                  sleep(2)
                  saveShot("01-dashboard")

                  tapButton(matching: "连接 magpie web", in: app)
                  sleep(1)
                  saveShot("02-server-editor")
                  tapButton(matching: "取消", in: app)
                  sleep(1)

                  tapButton(matching: "供应商", in: app)
                  sleep(1)
                  saveShot("03-providers")

                  tapButton(matching: "用量", in: app)
                  sleep(1)
                  saveShot("04-usage")

                  tapButton(matching: "隐私与设置", in: app)
                  sleep(1)
                  saveShot("05-privacy-settings")
              }
          }
          EOF

          python3 -c '
          with open("project.yml", "r") as f:
              txt = f.read()
          idx = txt.find("    schemes:")
          if idx != -1:
              txt = txt[:idx]
          lines = [
              "    scheme:",
              "      testTargets:",
              "        - MagpieUITests",
              "",
              "  MagpieUITests:",
              "    type: bundle.ui-testing",
              "    platform: iOS",
              "    deploymentTarget: \"15.0\"",
              "    sources:",
              "      - path: MagpieUITests",
              "    dependencies:",
              "      - target: Magpie",
              "    settings:",
              "      base:",
              "        PRODUCT_BUNDLE_IDENTIFIER: ai.usemagpie.ios.uitests",
              "        CODE_SIGNING_ALLOWED: \"NO\"",
              "        CODE_SIGNING_REQUIRED: \"NO\"",
              "        GENERATE_INFOPLIST_FILE: \"YES\"",
          ]
          with open("project.yml", "w") as f:
              f.write(txt.rstrip() + "\n" + "\n".join(lines) + "\n")
          '
          xcodegen generate --spec project.yml

      - name: Run UI tests in iOS Simulator to capture screenshots
        run: |
          set -o pipefail
          rm -rf build/TestResults.xcresult
          mkdir -p build/screenshots
          xcodebuild test \
            -project Magpie.xcodeproj \
            -scheme Magpie \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -only-testing:MagpieUITests/MagpieScreenshotTests/testCaptureAllTabs \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tee build/xcodebuild-test.log

      - name: Extract PNG screenshots from xcresult
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/screenshots || true
            ls -la build/screenshots || true
          fi

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magpie-simulator-screenshots
          path: |
            build/screenshots
            build/xcodebuild-test.log
          retention-days: 7
