name: Model Contracts
on:
  push:
  workflow_dispatch:
jobs:
  contracts:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run backend model contract tests
        run: |
          swiftc Magpie/Core/MagpieWebModels.swift Magpie/Core/SubscriptionCatalog.swift Magpie/Core/MagpieOperationModels.swift Magpie/Core/ConsoleDestination.swift Magpie/Core/ProviderEditPayload.swift Magpie/Core/OAuthCallbackHelper.swift Tests/ModelContractTests.swift -o /tmp/magpie-contracts
          /tmp/magpie-contracts
